<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>JavaQuest</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Java lernen, Level für Level – jede Codezeile in Alltagssprache erklärt.">
<meta name="theme-color" content="#F57321">

<!-- Damit Safari die Seite nach „Zum Home-Bildschirm“ wie eine App startet: ohne Adressleiste. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JavaQuest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css?v=b08478639d67">
</head>
<body>
<!-- Erste Tabulator-Station: überspringt die Navigation und führt direkt zum Inhalt. -->
<a class="sprungmarke" href="#app">Zum Inhalt springen</a>

<main id="app" class="app">
  <p class="laden">JavaQuest wird geladen …</p>
</main>

<!-- Hinweis beim ersten Besuch in Safari: wie die App auf den Home-Bildschirm kommt. -->
<div id="installieren" class="install" role="region" aria-label="Hinweis zur Installation" hidden>
  <div>
    <strong>Als App installieren</strong>
    <p>Unten auf <span class="teilen">Teilen</span> tippen und dann „Zum Home-Bildschirm“ wählen. Danach startet JavaQuest wie eine normale App – auch ohne Internet.</p>
  </div>
  <button type="button" id="installieren-zu">Verstanden</button>
</div>

<script src="app.js?v=b08478639d67"></script>
</body>
</html>
