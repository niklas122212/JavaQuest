# Veröffentlicht die Web-Fassung unter github.io – der Link zum Verschicken.
name: Web-App veröffentlichen

on:
  push:
    branches: [main]
    paths: ["Web/**", ".github/workflows/web.yml", ".github/workflows/pruefungen.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Erst prüfen, dann veröffentlichen. Vorher ging jeder Push ungeprüft live –
  # ein Fehler in app.js oder in der Kursdatei wäre sofort auf der Seite gelandet,
  # die verschickt wird.
  pruefen:
    uses: ./.github/workflows/pruefungen.yml
    with:
      nur_schnell: true

  veroeffentlichen:
    needs: pruefen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Web
      - id: pages
        uses: actions/deploy-pages@v4
